<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="favicon-32.png?v=2" type="image/png" sizes="32x32">
<link rel="icon" href="favicon-512.png?v=2" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bill of materials | RTS Compact 5 | REUDE Technologies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #18222d; --steel: #5b6875; --rule: #cfd6dd;
    --blue: #1f5c99; --orange: #e8630a; --paper: #f4f7fb;
    --sans: "Barlow", "Segoe UI", system-ui, sans-serif;
    --cond: "Barlow Condensed", "Arial Narrow", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink); background: var(--paper);
    font: 400 15px/1.45 var(--sans);
  }
  header, main { width: min(1100px, calc(100% - 32px)); margin: 0 auto; }
  header {
    display: flex; justify-content: space-between; align-items: flex-end; gap: 16px;
    padding: 28px 0 16px;
  }
  h1 { margin: 0; font: 700 36px/1 var(--cond); }
  p.sub { margin: 6px 0 0; color: var(--steel); }
  a { color: var(--blue); }
  .actions { display: flex; gap: 8px; align-items: center; }
  button, a.btn {
    font: 500 14px/1 var(--sans); color: var(--ink); background: #fff;
    border: 1px solid var(--rule); border-radius: 999px; padding: 10px 14px;
    text-decoration: none; cursor: pointer;
  }
  button.primary { background: var(--orange); color: #fff; border-color: var(--orange); }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { font: 600 13px/1.2 var(--sans); color: var(--steel); background: #f7f9fb; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.section td { background: #eef3f8; color: var(--blue); font: 600 14px/1.2 var(--cond); letter-spacing: 0.02em; }
  .tbd { color: var(--steel); }
  .tag {
    display: inline-block; margin-top: 4px; padding: 2px 7px; border-radius: 999px;
    background: rgba(232, 99, 10, 0.12); color: #9a4206; font-size: 12px;
  }
  tfoot td { font-weight: 600; border-bottom: 0; }
  .note { color: var(--steel); font-size: 14px; margin: 14px 0 32px; }
  @media print {
    body { background: #fff; }
    .actions { display: none; }
    header, main { width: 100%; }
    a { color: inherit; text-decoration: none; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Bill of materials</h1>
    <p class="sub">RTS Compact 5 · 5 kgf thrust and torque stand · REUDE Technologies</p>
  </div>
  <div class="actions">
    <a class="btn" href="index.html">Back to viewer</a>
    <button class="primary" type="button" id="print">Print</button>
  </div>
</header>
<main>
  <table>
    <thead>
      <tr>
        <th>Item</th>
        <th>Part</th>
        <th>Material</th>
        <th class="num">Qty</th>
        <th class="num">Unit price</th>
        <th class="num">Line total</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
    <tfoot>
      <tr>
        <td colspan="5">Total of priced lines</td>
        <td class="num" id="total"></td>
      </tr>
    </tfoot>
  </table>
  <p class="note" id="note"></p>
</main>
<script type="module">
import { ITEMS, SECTIONS } from './catalog.js';
import { PRICES, CURRENCY, REFERENCE } from './bom.js';

const MATERIAL = {
  alu: 'Aluminium, clear anodised',
  sheet: 'Sheet metal',
  cell: 'Beam load cell',
  printed: '3D printed',
  black: 'Black hardware',
  rubber: 'Rubber',
  motor: 'Brushless motor',
  carbon: 'Carbon fibre',
  fastener: 'Steel fastener',
  pcb: 'Printed circuit board',
  brass: 'Brass',
};

const money = new Intl.NumberFormat('en-IN', { style: 'currency', currency: CURRENCY, maximumFractionDigits: 2 });
const rows = document.getElementById('rows');
let sum = 0;
let open = 0;

for (const section of SECTIONS) {
  const head = document.createElement('tr');
  head.className = 'section';
  head.innerHTML = `<td colspan="6">${section.name}</td>`;
  rows.appendChild(head);
  for (const item of ITEMS.filter((entry) => entry.s === section.id)) {
    const price = PRICES[item.n];
    const priced = typeof price === 'number' && Number.isFinite(price);
    const line = priced ? price * item.qty : null;
    if (priced) sum += line;
    else open += 1;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="num">${item.n}</td>
      <td>${item.name}${REFERENCE.has(item.n) ? '<div class="tag">Reference fitment</div>' : ''}<div class="tbd">${item.desc}</div></td>
      <td>${MATERIAL[item.mat] || item.mat}</td>
      <td class="num">${item.qty}</td>
      <td class="num">${priced ? money.format(price) : '<span class="tbd">To be updated</span>'}</td>
      <td class="num">${priced ? money.format(line) : '<span class="tbd">—</span>'}</td>`;
    rows.appendChild(tr);
  }
}

document.getElementById('total').textContent = money.format(sum);
document.getElementById('note').textContent =
  `${open} line${open === 1 ? '' : 's'} still need a price. Edit the matching number in bom.js; quantities stay in catalog.js. The total includes only lines that have a price. Reference fitment is the motor and propeller shown on the model.`;
document.getElementById('print').addEventListener('click', () => window.print());
</script>
</body>
</html>
